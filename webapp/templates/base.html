<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lockout help{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5b6475; --line: #d9dde5;
      --accent: #1f4fd8; --good: #17663a; --good-bg: #e6f4ec; --info: #1f4fd8; --info-bg: #e8eefc;
      --warn: #8a5a00; --warn-bg: #fff3d6; --urgent: #ffffff; --urgent-bg: #b3261e; --err: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171d; --card: #1d222b; --text: #e8ebf1; --muted: #a2abbb; --line: #384051;
        --accent: #7ea2ff; --good: #7fd6a2; --good-bg: #17301f; --info: #9db6ff; --info-bg: #1b2745;
        --warn: #ffd37a; --warn-bg: #3a2d10; --urgent-bg: #d3453c; --err: #ff8a82;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; padding-top: 16px; padding-bottom: 8px; }
    header strong { font-size: 1.1rem; margin-right: auto; }
    a { color: var(--accent); }
    main { padding-top: 8px; padding-bottom: 32px; }
    footer { color: var(--muted); font-size: .85rem; padding-bottom: 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    h2 { font-size: 1.05rem; margin: 20px 0 6px; }
    label, legend { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type=text], textarea { width: 100%; padding: 10px; font: inherit; color: inherit; background: var(--bg);
                                 border: 1px solid var(--line); border-radius: 6px; }
    textarea { min-height: 84px; }
    .field { margin-bottom: 16px; }
    .field.has-error input, .field.has-error textarea { border-color: var(--err); border-width: 2px; }
    .error { color: var(--err); font-weight: 600; margin: 4px 0 0; }
    p.error[role=alert] { margin: 0 0 16px; }
    .hint { color: var(--muted); font-size: .9rem; margin: 0 0 4px; }
    fieldset { border: 0; padding: 0; margin: 0 0 16px; }
    .radio { display: inline-flex; align-items: center; gap: 6px; margin-right: 20px; font-weight: 400; }
    button, .button { display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 6px;
                      padding: 10px 18px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    .banner { border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
    .banner h1 { margin: 0; }
    .tone-good   { background: var(--good-bg);  color: var(--good); }
    .tone-info   { background: var(--info-bg);  color: var(--info); }
    .tone-warn   { background: var(--warn-bg);  color: var(--warn); }
    .tone-urgent { background: var(--urgent-bg); color: var(--urgent); }
    .callnow { font-size: 1.3rem; font-weight: 700; margin: 8px 0 0; }
    .callnow a { color: inherit; }
    .ask { border-left: 4px solid var(--info); padding: 8px 12px; background: var(--info-bg); margin: 12px 0; font-weight: 600; }
    ul { padding-left: 22px; margin: 6px 0; }
    table { width: 100%; min-width: 640px; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; vertical-align: top; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    td:first-child { white-space: nowrap; }
    tr:target { background: var(--info-bg); }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-weight: 600; font-size: .82rem; }
    .scroll { overflow-x: auto; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <strong>Vehicle lockout help</strong>
    <a href="{{ url_for('main.form') }}">New request</a>
    <a href="{{ url_for('main.tickets') }}">Ticket log</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Clock used for night checks: {{ clock_now }} ({{ clock_kind }}). Unlocks in this prototype are simulated.</footer>
</body>
</html>
