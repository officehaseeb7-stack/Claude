<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lockout help{% endblock %}</title>
  <style>
    /* THEME: every colour and font below comes from the variables in this block.
       Colours were sampled from a screenshot of 1now.ai (see README, "Look and feel").
       Fonts are NOT applied yet: set --font-body / --font-heading (and add a font link above
       this <style>) once the exact typefaces are known. */
    :root {
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-heading: var(--font-body);

      --brand: #F47845;          /* orange: buttons, accents (sampled) */
      --brand-hover: #E4642F;    /* derived: slightly deeper orange */
      --on-brand: #FFFFFF;       /* text on orange buttons */
      --brand-text: #B8481A;     /* derived: orange dark enough to read as small text on light backgrounds */
      --brand-tint: #FDF1E9;     /* derived: very light orange wash */

      --topbar: #121F2F;         /* header: dark navy (sampled) */
      --on-topbar: #FFFFFF;
      --bg: #FAF8F4;             /* page: warm off-white (sampled) */
      --card: #FFFFFF;           /* cards (sampled) */
      --text: #14253A;           /* body and headings (exact, from the site's computed style) */
      --muted: #5E6B7A;          /* derived: softer navy-grey */
      --line: #E7E2D8;           /* derived: warm hairline */
      --shadow: 0 8px 24px rgba(20, 37, 58, .07);
      --link: var(--brand-text);
      --radius-card: 16px;
      --radius-field: 10px;

      --good: #17663A;   --good-bg: #E3F3EA;
      --info: #14253A;   --info-bg: #E6ECF4;
      --warn: #8A3510;   --warn-bg: #FDE9DC;
      --urgent: #FFFFFF; --urgent-bg: #B3261E;
      --err: #B3261E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --topbar: #0B131C; --bg: #101213; --card: #181A1C; --text: #F4F1EA; --muted: #A9B0BA;
        --line: #2C3033; --shadow: 0 8px 24px rgba(0, 0, 0, .35);
        --brand-tint: #2A1A12; --link: #FF9A6B;
        --good: #8FE0AE; --good-bg: #14301F; --info: #D4E3F6; --info-bg: #17263A;
        --warn: #FFC9A6; --warn-bg: #3A2312; --urgent-bg: #C23B31; --err: #FF8A82;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--font-body); }
    .topbar { background: var(--topbar); color: var(--on-topbar); }
    header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    header { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; padding-top: 16px; padding-bottom: 16px; }
    header strong { font-family: var(--font-heading); font-size: 1.1rem; margin-right: auto; letter-spacing: .01em; }
    header a { color: var(--on-topbar); text-decoration: none; font-weight: 600; font-size: .95rem; }
    header a:hover { color: var(--brand); }
    a { color: var(--link); }
    main { padding-top: 24px; padding-bottom: 32px; }
    footer { color: var(--muted); font-size: .85rem; padding-bottom: 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-card);
            box-shadow: var(--shadow); padding: 24px; margin-bottom: 16px; }
    h1, h2 { font-family: var(--font-heading); }
    h1 { font-size: 1.6rem; line-height: 1.2; letter-spacing: -.01em; margin: 0 0 8px; }
    /* small orange uppercase section labels, as on the 1now.ai site */
    h2 { font-size: .78rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
         color: var(--brand-text); margin: 22px 0 6px; }
    label, legend { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type=text], textarea { width: 100%; padding: 11px 12px; font: inherit; color: inherit; background: var(--card);
                                 border: 1px solid var(--line); border-radius: var(--radius-field); }
    input[type=text]:focus, textarea:focus { outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent);
                                             border-color: var(--brand); }
    textarea { min-height: 84px; }
    .field { margin-bottom: 18px; }
    .field.has-error input, .field.has-error textarea { border-color: var(--err); border-width: 2px; }
    .error { color: var(--err); font-weight: 600; margin: 4px 0 0; }
    .hint { color: var(--muted); font-size: .9rem; margin: 0 0 4px; }
    fieldset { border: 0; padding: 0; margin: 0 0 18px; }
    .radio { display: inline-flex; align-items: center; gap: 6px; margin-right: 20px; font-weight: 400; }
    input[type=radio] { accent-color: var(--brand); width: 1.1rem; height: 1.1rem; }
    button, .button { font-family: var(--font-body); display: inline-block; background: var(--brand); color: var(--on-brand);
                      border: 0; border-radius: 999px; padding: 11px 24px; font-size: 1rem; font-weight: 700;
                      text-decoration: none; cursor: pointer; box-shadow: 0 6px 16px rgba(244, 120, 69, .30); }
    button:hover, .button:hover { background: var(--brand-hover); }
    button:focus-visible, .button:focus-visible, a:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
    .banner { border-radius: var(--radius-card); padding: 18px 22px; margin-bottom: 16px; }
    .banner h1 { margin: 0; }
    .tone-good   { background: var(--good-bg);  color: var(--good); }
    .tone-info   { background: var(--info-bg);  color: var(--info); }
    .tone-warn   { background: var(--warn-bg);  color: var(--warn); }
    .tone-urgent { background: var(--urgent-bg); color: var(--urgent); }
    .callnow { font-size: 1.15rem; font-weight: 700; margin: 8px 0 0; }
    .ask { border-left: 4px solid var(--brand); border-radius: 0 var(--radius-field) var(--radius-field) 0;
           padding: 14px 16px; background: var(--brand-tint); margin: 16px 0; }
    .ask label { color: var(--text); }
    .ask .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .ask .row input { flex: 1 1 220px; width: auto; }
    .ask.has-error input { border-color: var(--err); border-width: 2px; }
    ul { padding-left: 22px; margin: 6px 0; }
    table { width: 100%; min-width: 640px; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; vertical-align: top; padding: 10px 6px; border-bottom: 1px solid var(--line); }
    th { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    td:first-child { white-space: nowrap; }
    tr:target { background: var(--brand-tint); }
    .scroll { overflow-x: auto; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div class="topbar">
    <header>
      <strong>Vehicle lockout help</strong>
      <a href="{{ url_for('main.form') }}">New request</a>
      <a href="{{ url_for('main.tickets') }}">Ticket log</a>
    </header>
  </div>
  <main>{% block content %}{% endblock %}</main>
  <footer>Clock used for night checks: {{ clock_now }} ({{ clock_kind }}). Unlocks in this prototype are simulated.</footer>
</body>
</html>
